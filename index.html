<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Theory | Beyond the Stars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <h1 class="glitch" data-text="READY TO GO BEYOND">READY TO GO BEYOND</h1>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="hidden">
        <div class="stars"></div>
        <div class="twinkling"></div>

        <section class="hero">
            <h1 class="main-title">SPACE</h1>
            <p class="subtitle">Exploring the unseen dimensions of the cosmos.</p>
        </section>

        <div class="gallery">
            <div class="sticky-note" onclick="showHistory('1')">
                <img src="1.jpg" alt="Galaxy Theory">
                <p>Singularity</p>
            </div>
            <div class="sticky-note" onclick="showHistory('2')">
                <img src="2.jpg" alt="Black Hole">
                <p>Event Horizon</p>
            </div>
            <div class="sticky-note" onclick="showHistory('3')">
                <img src="3.jpg" alt="Nebula">
                <p>Stellar Nursery</p>
            </div>
            <div class="sticky-note" onclick="showHistory('4')">
                <img src="4.jpg" alt="Dark Matter">
                <p>Dark Energy</p>
            </div>
        </div>

        <!-- History Modal -->
        <div id="history-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2 id="history-title"></h2>
                <p id="history-text"></p>
            </div>
        </div>

        <footer>
            <p>Theory by <strong>_ Aarthav Yadav</strong></p>
            <p>For connection: <a href="mailto:fahh07-email@example.com">Contact Us</a></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
