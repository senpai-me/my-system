<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProDownloader - Direct Save</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0c0c0c; --accent: #1db954; --card-bg: #181818; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        
        /* Search Box */
        .search-area { background: #1e1e1e; padding: 15px; border-radius: 50px; display: flex; gap: 10px; border: 1px solid #333; margin-bottom: 30px; }
        input { flex: 1; padding: 10px 20px; border-radius: 40px; border: none; background: transparent; color: white; font-size: 1.1rem; outline: none; }
        .btn-load { background: var(--accent); color: black; border: none; padding: 0 30px; border-radius: 40px; font-weight: bold; cursor: pointer; }

        /* Hidden Download Player */
        #download-viewer { display: none; margin-top: 30px; background: #000; padding: 20px; border-radius: 15px; border: 2px solid var(--accent); text-align: center; }
        video { width: 100%; border-radius: 10px; max-height: 400px; background: #111; }

        /* Quality List */
        .quality-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .q-btn { background: #222; border: 1px solid #444; color: white; padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; transition: 0.3s; }
        .q-btn:hover { border-color: var(--accent); background: #282828; }
        .q-btn i { display: block; margin-bottom: 5px; color: var(--accent); }

        .gateway-btn { display: inline-block; margin-top: 40px; color: var(--accent); border: 1px solid var(--accent); padding: 10px 25px; border-radius: 50px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align:center;">Pro<span style="color:var(--accent)">Downloader</span> V3</h1>
        
        <div class="search-area">
            <input type="text" id="ytLink" placeholder="Paste YouTube Link here...">
            <button class="btn-load" onclick="generateLinks()">GENERATE</button>
        </div>

        <div id="status-msg" style="text-align: center; color: var(--accent); display: none;">Fetching Direct Streams...</div>

        <div class="quality-list" id="qList" style="display: none;">
            <div class="q-btn" onclick="openPlayer('360')"><i class="fas fa-video"></i> 360p</div>
            <div class="q-btn" onclick="openPlayer('720')"><i class="fas fa-video"></i> 720p (HD)</div>
            <div class="q-btn" onclick="openPlayer('1080')"><i class="fas fa-video"></i> 1080p (FHD)</div>
            <div class="q-btn" onclick="openPlayer('mp3')"><i class="fas fa-music"></i> MP3 Audio</div>
        </div>

        <div id="download-viewer">
            <h3 id="view-title">Download Preview</h3>
            <p style="font-size: 0.8rem; color: #888;">Click the 3 dots (⋮) on the player and select "Download"</p>
            <video id="v-player" controls controlsList="nodownload" poster="https://via.placeholder.com/800x450/000/fff?text=Loading+Stream..."></video>
            <div style="margin-top: 15px;">
                <button onclick="closePlayer()" style="background:#ff0055; color:white; border:none; padding:8px 20px; border-radius:5px; cursor:pointer;">Close Player</button>
            </div>
        </div>

        <div style="text-align:center;">
            <a href="info2.html" class="gateway-btn">Gateway</a>
        </div>
    </div>
