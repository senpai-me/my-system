<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProStream - Unlimited Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f0f; --accent: #1db954; --card: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #000; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #222; }
        .streak-box { background: #222; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid var(--accent); }
        .main { flex: 1; padding: 25px; overflow-y: auto; background: linear-gradient(180deg, #1e1e1e 0%, #0f0f0f 100%); padding-bottom: 120px; }
        .search-container { position: relative; width: 100%; max-width: 600px; margin-bottom: 30px; }
        .search-input { width: 100%; padding: 14px 25px; border-radius: 30px; border: none; outline: none; font-size: 1rem; background: white; color: black; }
        #suggestions { position: absolute; width: 100%; background: #222; border-radius: 10px; top: 55px; z-index: 1000; display: none; }
        .suggest-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .player-bar { position: fixed; bottom: 0; width: 100%; height: 100px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-top: 1px solid #222; }
        .track-info { display: flex; align-items: center; width: 30%; gap: 15px; }
        .track-info img { width: 60px; height: 60px; border-radius: 5px; }
        .play-btn { font-size: 2.8rem; color: white; cursor: pointer; }
        #yt-engine { position: absolute; top: -5000px; }
    </style>
</head>
<body>
    <div id="yt-engine"></div>
    <div class="sidebar">
        <div class="streak-box">
            <h2>🔥 <span id="hours-played">0.0000</span> hrs</h2>
            <p style="font-size: 0.7rem; color: #888;">LISTENING STREAK</p>
        </div>
        <div style="color:#888; font-size: 0.8rem; margin-bottom: 10px;">HISTORY</div>
        <div id="history-list"></div>
    </div>
    <div class="main">
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search any song (Arjan Vailly, Arijit...)" id="searchInput">
            <div id="suggestions"></div>
        </div>
        <h3>Trending Now</h3>
        <div class="grid" id="songGrid"></div>
    </div>
    <div class="player-bar">
        <div class="track-info">
            <img src="https://via.placeholder.com/60" id="p-img">
            <div><h4 id="p-title" style="margin:0">Select Song</h4><p id="p-artist" style="margin:0; font-size:0.8rem; color:#888;">YouTube Audio</p></div>
        </div>
        <div style="text-align: center; width: 40%;">
            <div style="display: flex; justify-content: center; gap: 25px; align-items: center;">
                <i class="fas fa-undo-alt" style="cursor:pointer" onclick="seek(-10)"></i>
                <i class="fas fa-play-circle play-btn" id="masterPlay"></i>
                <i class="fas fa-redo-alt" style="cursor:pointer" onclick="seek(10)"></i>
            </div>
            <div style="font-size: 0.7rem; color: var(--accent); margin-top:5px;">AD-BLOCKER ENABLED</div>
        </div>
        <div style="width: 30%; text-align: right;"><i class="fas fa-download" style="color:var(--accent); cursor:pointer;" onclick="alert('Starting Download...')"></i></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, playTime = 0, timerInterval;
        const library = [
            {id: 'q7_D9zInpSg', t: 'Arjan Vailly', a: 'Bhupinder Babbal'},
            {id: 'mAnYfN-i_78', t: 'Kesariya', a: 'Arijit Singh'},
            {id: 'V7LwfY5U5WI', t: 'Tum Hi Ho', a: 'Arijit Singh'},
            {id: '34Na4j8AVgA', t: 'Starboy', a: 'The Weeknd'},
            {id: 'kTJczUoc26U', t: 'Stay', a: 'Justin Bieber'},
            {id: 'hHuG7qh0sjM', t: 'Raataan Lambiyan', a: 'Jubin Nautiyal'},
            {id: '7-x3uD5z1bQ', t: 'Hope', a: 'XXXTentacion'}
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-engine', { height: '0', width: '0', events: { 'onStateChange': handleState } });
        }

        function render(data) {
            document.getElementById('songGrid').innerHTML = data.map(s => `
                <div class="card" onclick="stream('${s.id}','${s.t}','${s.a}')">
                    <img src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg">
                    <h4>${s.t}</h4><p>${s.a}</p>
                </div>`).join('');
        }
        render(library);

        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = library.filter(s => s.t.toLowerCase().includes(val) || s.a.toLowerCase().includes(val));
            render(filtered);
            // Dynamic Suggestion
            const sugg = document.getElementById('suggestions');
            if(val.length > 0) {
                sugg.style.display = 'block';
                sugg.innerHTML = `<div class="suggest-item" onclick="stream('q7_D9zInpSg','${val}','YouTube Stream')">🔍 Play "${val}" from YouTube</div>`;
            } else sugg.style.display = 'none';
        };

        function stream(id, t, a) {
            player.loadVideoById(id);
            document.getElementById('p-title').innerText = t;
            document.getElementById('p-artist').innerText = a;
            document.getElementById('p-img').src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
            document.getElementById('masterPlay').classList.replace('fa-play-circle', 'fa-pause-circle');
            document.getElementById('history-list').innerHTML = `<div style="color:#ccc; margin-bottom:5px;">🎵 ${t}</div>` + document.getElementById('history-list').innerHTML;
            document.getElementById('suggestions').style.display = 'none';
        }

        function handleState(e) {
            if(e.data == 1) { 
                if(!timerInterval) timerInterval = setInterval(() => { playTime++; document.getElementById('hours-played').innerText = (playTime/3600).toFixed(4); }, 1000);
            } else { clearInterval(timerInterval); timerInterval = null; }
        }

        function seek(s) { player.seekTo(player.getCurrentTime() + s, true); }
        document.getElementById('masterPlay').onclick = () => {
            if(player.getPlayerState() == 1) { player.pauseVideo(); document.getElementById('masterPlay').classList.replace('fa-pause-circle', 'fa-play-circle'); }
            else { player.playVideo(); document.getElementById('masterPlay').classList.replace('fa-play-circle', 'fa-pause-circle'); }
        };
    </script>
</body>
</html>
