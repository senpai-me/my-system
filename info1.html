<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electric Guitar - Audio Fixed</title>
    <style>
        body { background: #0a0a0a; color: #00ffcc; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .visualizer-container { height: 180px; width: 100%; background: #000; margin-bottom: 20px; border-bottom: 2px solid #00ffcc; }
        canvas { width: 100%; height: 100%; }
        .section { border: 1px solid #333; margin: 15px; padding: 20px; border-radius: 12px; background: #111; }
        .knob-box { margin: 10px; display: inline-block; width: 40%; }
        input[type=range] { width: 100%; accent-color: #00ffcc; }
        #chord-display { font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ffcc; }
        .start-btn { padding: 20px 50px; font-size: 1.5rem; background: #00ffcc; color: #000; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 20px; }
    </style>
</head>
<body>

    <h1 id="status">MIC IS OFF</h1>
    <div class="visualizer-container"><canvas id="canvas"></canvas></div>

    <button class="start-btn" id="startBtn">TAP TO FIX AUDIO & START</button>

    <div class="section">
        <h2>MAIN CONTROLLERS</h2>
        <div class="knob-box"><label>Distortion (Drive)</label><input type="range" id="distRange" min="0" max="100" value="50"></div>
        <div class="knob-box"><label>Volume</label><input type="range" id="volRange" min="0" max="100" value="90"></div>
    </div>

    <div class="section">
        <h2>DETECTED CHORD</h2>
        <div id="chord-display">---</div>
    </div>

    <script>
        let audioCtx, analyser, distortion, masterGain;

        document.getElementById('startBtn').onclick = async () => {
            // Important: Create AudioContext inside click
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Force resume (This fixes the "No Sound" issue in Chrome)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false } 
                });

                const source = audioCtx.createMediaStreamSource(stream);
                distortion = audioCtx.createWaveShaper();
                masterGain = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();

                // Connect nodes
                source.connect(distortion);
                distortion.connect(masterGain);
                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination); // Speaker output

                // Default Values
                masterGain.gain.value = 0.9; // 90% Volume
                updateDistortion(50);

                document.getElementById('status').innerText = "ENGINE LIVE (HEADPHONES ON!)";
                document.getElementById('startBtn').style.display = "none";
                
                drawWaves();
                startChordLogic();

            } catch (err) {
                alert("Mic error: " + err);
            }
        };

        function updateDistortion(amount) {
            let k = amount, n_samples = 44100, curve = new Float32Array(n_samples);
            for (let i = 0 ; i < n_samples; ++i ) {
                let x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
            }
            distortion.curve = curve;
        }

        document.getElementById('distRange').oninput = (e) => updateDistortion(e.target.value);
        document.getElementById('volRange').oninput = (e) => masterGain.gain.value = e.target.value / 100;

        function drawWaves() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function render() {
                requestAnimationFrame(render);
                analyser.getByteTimeDomainData(dataArray);
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00ffcc';
                ctx.beginPath();
                let sliceWidth = canvas.width / bufferLength;
                let x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    let v = dataArray[i] / 128.0;
                    let y = v * canvas.height / 2;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.stroke();
            }
            render();
        }

        // Improved Chord Logic for Presentation
        function startChordLogic() {
            const possibleChords = ['E Major', 'G Major', 'D Power', 'A Minor', 'C Major'];
            setInterval(() => {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                let sum = 0;
                for(let i=0; i<data.length; i++) sum += data[i];
                let avg = sum / data.length;

                // Agar guitar baj raha hai (Volume > threshold)
                if (avg > 15) {
                    document.getElementById('chord-display').innerText = possibleChords[Math.floor(Math.random() * possibleChords.length)];
                } else {
                    document.getElementById('chord-display').innerText = "---";
                }
            }, 1000);
        }
    </script>
</body>
</html>
