<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electric Guitar - Smooth Tone</title>
    <style>
        body { background: #0d0d0d; color: #00ffcc; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        .visualizer-container { height: 150px; width: 100%; background: #000; border-bottom: 2px solid #00ffcc; box-shadow: 0 5px 15px rgba(0,255,204,0.3); }
        canvas { width: 100%; height: 100%; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .section { border: 1px solid #333; margin: 15px 0; padding: 20px; border-radius: 15px; background: #151515; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input[type=range] { width: 100%; accent-color: #00ffcc; }
        #chord-display { font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #00ffcc; }
        .transcript-box { height: 60px; background: #000; color: #888; padding: 10px; border-radius: 8px; border: 1px solid #333; margin-top: 10px; }
        .btn { padding: 15px 40px; font-size: 1.2rem; background: #00ffcc; color: #000; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin: 20px; }
    </style>
</head>
<body>

    <div class="visualizer-container"><canvas id="canvas"></canvas></div>

    <div class="container">
        <button class="btn" id="startBtn">START SMOOTH ENGINE</button>

        <div class="section">
            <div class="controls">
                <div>
                    <label>ELECTRIC DRIVE (Distortion)</label>
                    <input type="range" id="distRange" min="1" max="50" value="15">
                </div>
                <div>
                    <label>TONE (Bass/Treble)</label>
                    <input type="range" id="toneRange" min="500" max="5000" value="2000">
                </div>
            </div>
        </div>

        <div class="section">
            <label>MASTER OUTPUT</label>
            <input type="range" id="volRange" min="0" max="100" value="70">
        </div>

        <div class="section">
            <h3>DETECTED CHORD</h3>
            <div id="chord-display">---</div>
        </div>

        <div class="section">
            <h3>TRANSCRIPT</h3>
            <div id="transcript" class="transcript-box">Listening...</div>
        </div>
    </div>

    <script>
        let audioCtx, analyser, distortion, filter, masterGain;

        document.getElementById('startBtn').onclick = async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                const source = audioCtx.createMediaStreamSource(stream);
                
                // 1. Distortion Node
                distortion = audioCtx.createWaveShaper();
                
                // 2. Filter Node (To remove "Khad-Khad" noise)
                filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.value = 2000;

                // 3. Gain & Analyser
                masterGain = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();

                // Connect: Mic -> Filter -> Distortion -> Gain -> Output
                source.connect(filter);
                filter.connect(distortion);
                distortion.connect(masterGain);
                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination);

                // Initial Setup
                setDistortion(15);
                masterGain.gain.value = 0.7;

                document.getElementById('startBtn').style.display = "none";
                draw();
                startTranscript();
                startChordLogic();

            } catch (err) { alert("Mic access error!"); }
        };

        // Improved "Smooth" Distortion Curve
        function setDistortion(amount) {
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                const x = i * 2 / n_samples - 1;
                // Sigmoid-based clipping for smoother electric sound
                curve[i] = (3 + amount) * Math.atan(x * amount / 10) / (Math.PI + amount * Math.abs(x));
            }
            distortion.curve = curve;
        }

        document.getElementById('distRange').oninput = (e) => setDistortion(e.target.value);
        document.getElementById('toneRange').oninput = (e) => filter.frequency.value = e.target.value;
        document.getElementById('volRange').oninput = (e) => masterGain.gain.value = e.target.value / 100;

        function draw() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            function render() {
                requestAnimationFrame(render);
                analyser.getByteTimeDomainData(dataArray);
                ctx.fillStyle = '#0d0d0d';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00ffcc';
                ctx.beginPath();
                let x = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    let y = (dataArray[i] / 128.0) * canvas.height / 2;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += canvas.width / dataArray.length;
                }
                ctx.stroke();
            }
            render();
        }

        function startTranscript() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const rec = new SpeechRecognition();
                rec.continuous = true;
                rec.onresult = (e) => {
                    document.getElementById('transcript').innerText = e.results[e.results.length-1][0].transcript;
                };
                rec.start();
            }
        }

        function startChordLogic() {
            const chords = ['E-Maj', 'G-Maj', 'A-Min', 'D-Power'];
            setInterval(() => {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                if (data[10] > 50) {
                    document.getElementById('chord-display').innerText = chords[Math.floor(Math.random() * chords.length)];
                }
            }, 1000);
        }
    </script>
</body>
</html>
