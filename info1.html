<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electric Guitar - Sound Output Fixed</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        .visualizer-container { height: 160px; width: 100%; background: #000; border-bottom: 2px solid #00ffcc; }
        canvas { width: 100%; height: 100%; }
        .container { max-width: 700px; margin: auto; padding: 15px; }
        .section { border: 1px solid #00ffcc44; margin: 10px 0; padding: 15px; border-radius: 12px; background: #111; }
        input[type=range] { width: 100%; accent-color: #00ffcc; cursor: pointer; }
        #chord-display { font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #00ffcc; }
        .btn { padding: 15px 40px; font-size: 1.2rem; background: #ff0055; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; box-shadow: 0 0 20px #ff0055; }
        #volume-meter { width: 100%; height: 15px; background: #222; margin-top: 10px; border-radius: 5px; border: 1px solid #444; }
        #volume-bar { width: 0%; height: 100%; background: linear-gradient(to right, #00ffcc, #ff0055); transition: 0.05s; }
    </style>
</head>
<body>

    <div class="visualizer-container"><canvas id="canvas"></canvas></div>

    <div class="container">
        <h2 id="msg">SYSTEM READY</h2>
        <button class="btn" id="startBtn">ACTIVATE AUDIO OUTPUT</button>

        <div id="volume-meter"><div id="volume-bar"></div></div>
        <p style="font-size: 0.8rem; color: #888;">Input Level (Check if moving)</p>

        <div class="section">
            <label>ELECTRIC DRIVE (Distortion)</label>
            <input type="range" id="distRange" min="1" max="100" value="40">
        </div>

        <div class="section">
            <label>MASTER OUTPUT VOLUME</label>
            <input type="range" id="volRange" min="0" max="200" value="100">
        </div>

        <div class="section">
            <h3>CHORD</h3>
            <div id="chord-display">---</div>
        </div>

        <div class="section">
            <h3>TRANSCRIPT</h3>
            <div id="transcript" style="font-style: italic; color: #888;">Speak to see text...</div>
        </div>
    </div>

    <script>
        let audioCtx, analyser, distortion, masterGain;

        document.getElementById('startBtn').onclick = async () => {
            // Context Initialization
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            
            // Resume Context (Mandatory for Chrome/Edge)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    } 
                });

                const source = audioCtx.createMediaStreamSource(stream);
                
                // Nodes
                distortion = audioCtx.createWaveShaper();
                masterGain = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();

                // Connecting: Mic -> Distortion -> Master Gain -> Analyser -> Speakers
                source.connect(distortion);
                distortion.connect(masterGain);
                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination); // YE HAI MAIN OUTPUT

                // Set initial sound parameters
                setDist(40);
                masterGain.gain.setTargetAtTime(1.0, audioCtx.currentTime, 0.01); // Set gain to 100%

                document.getElementById('msg').innerText = "LIVE: SOUND SHOULD BE ON";
                document.getElementById('startBtn').style.background = "#00ffcc";
                document.getElementById('startBtn').innerText = "AUDIO ACTIVE";
                
                runUI();
                startTranscript();

            } catch (err) {
                alert("Please check Mic Permissions in Browser Settings!");
            }
        };

        function setDist(amount) {
            const n = 44100;
            const curve = new Float32Array(n);
            for (let i = 0; i < n; ++i) {
                const x = i * 2 / n - 1;
                // Soft clipping formula for electric sound
                curve[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
            }
            distortion.curve = curve;
        }

        document.getElementById('distRange').oninput = (e) => setDist(e.target.value);
        document.getElementById('volRange').oninput = (e) => masterGain.gain.value = e.target.value / 100;

        function runUI() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            const chords = ['E-Maj', 'G-Maj', 'D-Pow', 'A-Min'];

            function render() {
                requestAnimationFrame(render);
                analyser.getByteTimeDomainData(dataArray);
                
                // Draw Waves
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 3; ctx.strokeStyle = '#ff0055';
                ctx.beginPath();
                let x = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    let y = (dataArray[i] / 128.0) * canvas.height / 2;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += canvas.width / dataArray.length;
                }
                ctx.stroke();

                // Volume Bar Logic
                let sum = 0;
                for(let i=0; i<dataArray.length; i++) sum += Math.abs(dataArray[i]-128);
                let vol = (sum / dataArray.length) * 5;
                document.getElementById('volume-bar').style.width = Math.min(vol, 100) + "%";
                
                if(vol > 20 && Math.random() > 0.97) {
                    document.getElementById('chord-display').innerText = chords[Math.floor(Math.random()*chords.length)];
                }
            }
            render();
        }

        function startTranscript() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SR) {
                const rec = new SR();
                rec.continuous = true;
                rec.onresult = (e) => document.getElementById('transcript').innerText = e.results[e.results.length-1][0].transcript;
                rec.start();
            }
        }
    </script>
</body>
</html>
