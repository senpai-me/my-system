<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electric Guitar Mode</title>
    <style>
        body { background: #0a0a0a; color: #00ffcc; font-family: 'Courier New', Courier, monospace; text-align: center; }
        .visualizer-container { height: 150px; width: 80%; margin: 20px auto; border: 1px solid #333; position: relative; }
        canvas { width: 100%; height: 100%; }
        
        .section { border: 2px solid #00ffcc; margin: 20px; padding: 20px; border-radius: 15px; background: #1a1a1a; }
        .controls { display: flex; justify-content: space-around; flex-wrap: wrap; }
        .knob { margin: 10px; }
        
        #chord-display { font-size: 3rem; font-weight: bold; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        button { padding: 10px 20px; background: #00ffcc; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ELECTRIC MODE ACTIVE</h1>
    <p>⚠️ Please wear headphones to avoid feedback!</p>
    <button onclick="startProcessing()">START CONVERTER</button>

    <div class="visualizer-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="section">
        <h2>MAIN CONTROLLER</h2>
        <div class="controls">
            <div class="knob">Distortion: <input type="range" id="dist" min="0" max="100" value="50"></div>
            <div class="knob">Gain: <input type="range" id="gain" min="0" max="100" value="70"></div>
        </div>
    </div>

    <div class="section">
        <h2>VOLUME / BASS / TREBLE</h2>
        <div class="controls">
            <div class="knob">Volume: <input type="range" id="vol" min="0" max="100" value="80"></div>
            <div class="knob">Bass: <input type="range" id="bass" min="0" max="100" value="50"></div>
            <div class="knob">Treble: <input type="range" id="treble" min="0" max="100" value="60"></div>
        </div>
    </div>

    <div class="section">
        <h3>DETECTED CHORD</h3>
        <div id="chord-display">---</div>
    </div>

    <script>
        let audioCtx;
        async function startProcessing() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { 
                echoCancellation: false, 
                noiseSuppression: false, 
                autoGainControl: false 
            } });
            
            const source = audioCtx.createMediaStreamSource(stream);
            
            // Effect: Distortion (Electric Sound)
            const distortion = audioCtx.createWaveShaper();
            function makeDistortionCurve(amount) {
                let k = typeof amount === 'number' ? amount : 50,
                    n_samples = 44100,
                    curve = new Float32Array(n_samples);
                for (let i = 0 ; i < n_samples; ++i ) {
                    let x = i * 2 / n_samples - 1;
                    curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }
            distortion.curve = makeDistortionCurve(100);

            // Visualizer Logic
            const analyser = audioCtx.createAnalyser();
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            source.connect(distortion);
            distortion.connect(analyser);
            analyser.connect(audioCtx.destination);

            function draw() {
                requestAnimationFrame(draw);
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteTimeDomainData(dataArray);
                
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#00ffcc';
                ctx.beginPath();
                let sliceWidth = canvas.width / bufferLength;
                let x = 0;
                for(let i = 0; i < bufferLength; i++) {
                    let v = dataArray[i] / 128.0;
                    let y = v * canvas.height/2;
                    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.stroke();
            }
            draw();
            
            // Dummy Chord Detection
            setInterval(() => {
                const chords = ['E Major', 'A Minor', 'G Major', 'D Major'];
                document.getElementById('chord-display').innerText = chords[Math.floor(Math.random() * chords.length)];
            }, 2000);
        }
    </script>
</body>
</html>
